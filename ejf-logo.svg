<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f5d060"/>
    <stop offset="50%" stop-color="#c9a84c"/>
    <stop offset="100%" stop-color="#9a7a28"/>
  </linearGradient>
  <linearGradient id="goldh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9a7a28"/>
    <stop offset="40%" stop-color="#f5d060"/>
    <stop offset="100%" stop-color="#9a7a28"/>
  </linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a3a5c"/>
    <stop offset="100%" stop-color="#0a1828"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>

